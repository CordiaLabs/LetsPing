[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "letsping"
version = "0.3.0"
description = "Agent trust layer: behavioral firewall, HITL, and Cryo-Sleep state for AI agents."
readme = "README.md"
license = "MIT"
authors = [{ name = "LetsPing Team", email = "hello@letsping.co" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.23.0",
    "cryptography>=41.0.0",
]


[project.optional-dependencies]
langgraph = ["langgraph>=0.0.15", "langchain-core>=0.1.52"]

[project.urls]
Homepage = "https://letsping.co"
Documentation = "https://letsping.co/docs"
Repository = "https://github.com/CordiaLabs/LetsPing"

[tool.hatch.build.targets.wheel]
packages = ["letsping"]